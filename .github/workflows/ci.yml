name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: '26.13.0'
    PNPM_VERSION: '12.18.0'

jobs:
    setup:
        name: Resolve Playwright version
        runs-on: ubuntu-latest
        outputs:
            playwright_version: ${{ steps.playwright.outputs.version }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # The version is pinned via catalog: in pnpm-workspace.yaml; parsing it here means
            # the playwright container image always matches without editing this workflow
            - name: Resolve playwright version from workspace catalog
              id: playwright
              run: |
                  version=$(sed -n 's/^    playwright: //p' pnpm-workspace.yaml | head -n1)
                  if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "Could not resolve a pinned playwright version, got: '$version'" >&2
                      exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "Playwright version: $version"

    quality:
        name: Format, Lint, Typecheck
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Enable pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm run fmt

            - name: Lint
              run: pnpm run lint

            - name: Typecheck
              run: pnpm run typecheck

    unit-test:
        name: Unit Tests (${{ matrix.project }})
        runs-on: ubuntu-latest
        needs: setup
        container:
            image: mcr.microsoft.com/playwright:v${{ needs.setup.outputs.playwright_version }}
        strategy:
            fail-fast: false
            matrix:
                project: [chromium, firefox, webkit]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Enable pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Install dependencies
              run: HOME=/root pnpm install --frozen-lockfile

            - name: Run unit tests in ${{ matrix.project }}
              run: HOME=/root pnpm run test -- --project=${{ matrix.project }}

    e2e:
        name: E2E Tests (${{ matrix.project }})
        runs-on: ubuntu-latest
        needs: setup
        container:
            image: mcr.microsoft.com/playwright:v${{ needs.setup.outputs.playwright_version }}
        strategy:
            fail-fast: false
            matrix:
                project: [chromium, firefox, webkit, 'Mobile Chrome', 'Mobile Safari']
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Enable pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Install dependencies
              run: HOME=/root pnpm install --frozen-lockfile

            - name: Run E2E tests on ${{ matrix.project }}
              run: HOME=/root pnpm run test:e2e -- --project="${{ matrix.project }}"

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Enable pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run build
