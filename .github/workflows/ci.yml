name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    quality:
        name: Format, Lint, Typecheck, Unit Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.18.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 26.13.0
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm run fmt

            - name: Lint
              run: pnpm run lint

            - name: Typecheck
              run: pnpm run typecheck

            - name: Unit tests
              run: pnpm run test

    e2e:
        name: E2E Tests
        runs-on: ubuntu-latest
        needs: quality
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.18.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 26.13.0
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium firefox webkit

            - name: Run E2E tests
              run: pnpm run test:e2e

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: quality
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.18.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 26.13.0
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run build
