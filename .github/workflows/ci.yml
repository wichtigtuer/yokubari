name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: '26.13.0'
    PNPM_VERSION: '12.18.0'
    # Must match the pinned playwright version in pnpm-workspace.yaml
    PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.0

jobs:
    quality:
        name: Format, Lint, Typecheck
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Enable pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm run fmt

            - name: Lint
              run: pnpm run lint

            - name: Typecheck
              run: pnpm run typecheck

    unit-test:
        name: Unit Tests (${{ matrix.project }})
        runs-on: ubuntu-latest
        container:
            image: ${{ env.PLAYWRIGHT_IMAGE }}
        strategy:
            fail-fast: false
            matrix:
                project: [chromium, firefox, webkit]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Enable pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Install dependencies
              run: HOME=/root pnpm install --frozen-lockfile

            - name: Run unit tests in ${{ matrix.project }}
              run: HOME=/root pnpm run test -- --project=${{ matrix.project }}

    e2e:
        name: E2E Tests (${{ matrix.project }})
        runs-on: ubuntu-latest
        container:
            image: ${{ env.PLAYWRIGHT_IMAGE }}
        strategy:
            fail-fast: false
            matrix:
                project: [chromium, firefox, webkit, 'Mobile Chrome', 'Mobile Safari']
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Enable pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Install dependencies
              run: HOME=/root pnpm install --frozen-lockfile

            - name: Run E2E tests on ${{ matrix.project }}
              run: HOME=/root pnpm run test:e2e -- --project="${{ matrix.project }}"

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Enable pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run build
